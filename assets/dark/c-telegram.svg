<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 52" width="190" height="52" role="img" aria-label="Telegram"><style>.stamp{transform-box:fill-box;transform-origin:center;opacity:0;animation:stamp .45s cubic-bezier(.2,1.4,.4,1) forwards}@keyframes stamp{from{opacity:0;transform:scale(1.7)}to{opacity:1;transform:scale(1)}}.in{opacity:0;animation:in .7s ease forwards}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.draw{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw var(--d,1s) cubic-bezier(.6,0,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}.l{font:600 14px ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.6px}</style><defs><filter id="worn" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/></filter></defs><rect x="1" y="1" width="188" height="50" rx="8" fill="#ece4d3" fill-opacity=".05" stroke="#ece4d3" stroke-opacity=".45"/><g transform="rotate(-3 27.0 26.0)"><g class="stamp" style="animation-delay:0.2s" filter="url(#worn)"><rect x="10" y="9" width="34" height="34" rx="5" fill="#d9483b"/><path d="M18.6 22.1V20.3L26.3 23.3V25L18.6 28.1V26.3L24.4 24.2ZM35.4 30.3V31.7H26.4V30.3Z" fill="#f7f0e1"/></g></g><text class="l" x="58" y="31" fill="#ece4d3">Telegram</text><text class="l" x="166" y="31" fill="#d9483b">↗</text></svg>
